<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#2196F3" opacity="0.1" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Newspaper Icon -->
  <g transform="translate(50, 50)">
    <!-- Paper -->
    <rect x="10" y="10" width="80" height="100" fill="none" stroke="#2196F3" stroke-width="2" rx="3"/>
    
    <!-- Title bar -->
    <rect x="15" y="20" width="70" height="8" fill="#2196F3" rx="2"/>
    
    <!-- Content lines -->
    <line x1="15" y1="35" x2="85" y2="35" stroke="#2196F3" stroke-width="1.5"/>
    <line x1="15" y1="42" x2="85" y2="42" stroke="#2196F3" stroke-width="1.5"/>
    <line x1="15" y1="49" x2="75" y2="49" stroke="#2196F3" stroke-width="1.5"/>
    
    <!-- Image placeholder -->
    <rect x="15" y="60" width="70" height="35" fill="#2196F3" opacity="0.2" stroke="#2196F3" stroke-width="1" rx="2"/>
    <text x="50" y="82" text-anchor="middle" font-size="12" fill="#2196F3">Image</text>
  </g>
</svg>
